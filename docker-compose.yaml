# Docker Compose for Local Development
#
# Access:
#   - Frontend UI: http://localhost:3000
#   - Backend API: http://localhost:3000/api/ (proxied through Nginx)
#   - Backend Direct: http://localhost:8000 (for debugging)
#   - ModelAdmin Direct: http://localhost:8100
#
# Run: docker-compose up -d
# Stop: docker-compose down
# Logs: docker-compose logs -f [service-name]

name: mlopsplatform

services:
  postgres-service:
    image: postgres:16-alpine
    container_name: postgres-container
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - local-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlops_backend"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Frontend: React + Vite application served with Nginx
  frontend-service:
    build:
      context: ./production_app/frontend
      dockerfile: Dockerfile
    container_name: frontend-container
    ports:
      - "3000:80"
    networks:
      - local-dev
    depends_on:
      - backend-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend: FastAPI application (named backend-service to match nginx.conf proxy target)
  backend-service:
    build:
      context: ./production_app/backend
      dockerfile: Dockerfile
    container_name: backend-container
    ports:
      - "8000:8000"
    env_file:
      - ./.env.local
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres-service:5432/mlops_backend
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-documents}
      - MODELADMIN_EXTERNAL_ENDPOINT=${MODELADMIN_EXTERNAL_ENDPOINT:-http://modeladmin-service:8100}
      - MODELADMIN_EXTERNAL_API_KEY=${MODELADMIN_EXTERNAL_API_KEY:-modeladmin-local-key}
    networks:
      - local-dev
    depends_on:
      postgres-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ModelAdmin: Standalone FastAPI runtime for candidate/review boundaries
  modeladmin-service:
    build:
      context: .
      dockerfile: modeladmin_sidecar/Dockerfile
    container_name: modeladmin-container
    ports:
      - "8100:8100"
    env_file:
      - ./.env.local
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - MODELADMIN_DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres-service:5432/mlops_modeladmin
      - MODELADMIN_SERVICE_PORT=8100
      - BOUNDARY_API_KEY=${BOUNDARY_API_KEY:-modeladmin-local-key}
    networks:
      - local-dev
    depends_on:
      postgres-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
networks:
  local-dev:
    driver: bridge
