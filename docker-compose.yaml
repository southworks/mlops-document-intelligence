# Docker Compose for Local Development
#
# Access:
#   - Frontend UI: http://localhost:3000
#   - Backend API: http://localhost:3000/api/ (proxied through Nginx)
#   - Backend Direct: http://localhost:8000 (for debugging)
#   - ModelAdmin Direct: http://localhost:8100
#
# Run: docker-compose up -d
# Stop: docker-compose down
# Logs: docker-compose logs -f [service-name]

name: mlopsplatform

services:
  # Frontend: React + Vite application served with Nginx
  frontend-service:
    build:
      context: ./production_app/frontend
      dockerfile: Dockerfile
    container_name: frontend-container
    ports:
      - "3000:80"
    networks:
      - local-dev
    depends_on:
      - backend-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend: FastAPI application (named backend-service to match nginx.conf proxy target)
  backend-service:
    build:
      context: ./production_app/backend
      dockerfile: Dockerfile
    container_name: backend-container
    ports:
      - "8000:8000"
    env_file:
      - ./.env.local
    environment:
      - MODE=api
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite:////app/data/invoice_ocr.db
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-documents}
      - AZURE_STORAGE_QUEUE_NAME=${AZURE_STORAGE_QUEUE_NAME:-document-processing}
      - MODELADMIN_EXTERNAL_ENDPOINT=${MODELADMIN_EXTERNAL_ENDPOINT:-http://modeladmin-service:8100}
      - MODELADMIN_EXTERNAL_API_KEY=${MODELADMIN_EXTERNAL_API_KEY:-modeladmin-local-key}
    volumes:
      # Shared SQLite volume used by both API and worker so they observe the same job state.
      - mlops-backend-data:/app/data
    networks:
      - local-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ModelAdmin: Standalone FastAPI runtime for candidate/review boundaries
  modeladmin-service:
    build:
      context: .
      dockerfile: modeladmin_sidecar/Dockerfile
    container_name: modeladmin-container
    ports:
      - "8100:8100"
    env_file:
      - ./.env.local
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - MODELADMIN_DATABASE_URL=sqlite:////app/data/modeladmin_service.db
      - MODELADMIN_SERVICE_PORT=8100
      - BOUNDARY_API_KEY=${BOUNDARY_API_KEY:-modeladmin-local-key}
    volumes:
      - mlops-modeladmin-data:/app/data
    networks:
      - local-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Worker: Queue-driven document processing runtime
  worker-service:
    build:
      context: ./production_app/backend
      dockerfile: Dockerfile
    container_name: worker-container
    env_file:
      - ./.env.local
    environment:
      MODE: worker
      DATABASE_URL: sqlite:////app/data/invoice_ocr.db
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-documents}
      AZURE_STORAGE_QUEUE_NAME: ${AZURE_STORAGE_QUEUE_NAME:-document-processing}
      MODELADMIN_EXTERNAL_ENDPOINT: ${MODELADMIN_EXTERNAL_ENDPOINT:-http://modeladmin-service:8100}
      MODELADMIN_EXTERNAL_API_KEY: ${MODELADMIN_EXTERNAL_API_KEY:-modeladmin-local-key}
    volumes:
      # Mount the same backend DB volume as API to keep job status and metadata consistent.
      - mlops-backend-data:/app/data
    networks:
      - local-dev
    depends_on:
      - backend-service


networks:
  local-dev:
    driver: bridge

volumes:
  mlops-backend-data:
    name: mlops-backend-data
  mlops-modeladmin-data:
    name: mlops-modeladmin-data