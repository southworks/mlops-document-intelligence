<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Datasets</title>
    <link rel="stylesheet" href="/modeladmin/ui/static/modeladmin-ui.css" />
  </head>
  <body>
    <main class="page">
      <header class="header header-row">
        <div>
          <h1>Training Datasets</h1>
          <p>All curated training dataset records.</p>
        </div>
        <nav class="stage-nav" aria-label="ModelAdmin workflow">
          <a href="/modeladmin/ui" class="stage-pill">Review</a>
          <span class="stage-sep">-&gt;</span>
          <a href="/modeladmin/ui/retrain-candidates" class="stage-pill">Approved</a>
          <span class="stage-sep">-&gt;</span>
          <a href="/modeladmin/ui/datasets" class="stage-pill active">Datasets</a>
          <span class="stage-sep">-&gt;</span>
          <a href="/modeladmin/ui/retrain-jobs" class="stage-pill">Models</a>
        </nav>
      </header>

      <div id="errorBox" class="error hidden"></div>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>ID</th>
              <th>Status</th>
              <th>Created by</th>
              <th>Created at</th>
              <th>Members</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>

      <footer class="pagination">
        <span id="paginationInfo">Total: 0 &bull; Page 1 of 1</span>
        <div>
          <button id="prevBtn" type="button">Previous</button>
          <button id="nextBtn" type="button">Next</button>
        </div>
      </footer>
    </main>

    <script src="/modeladmin/ui/static/datasets.js"></script>
  </body>
</html>
