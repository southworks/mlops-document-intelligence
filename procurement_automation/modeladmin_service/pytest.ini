[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit test (no external dependencies, fast)
    integration: Integration test (requires services)
    e2e: End-to-end test (full workflow)
    slow: Test takes > 5 seconds
    docker_required: Requires Docker Compose running
    external_service: Calls external services (Azure, etc)
    regression: Regression test against known data
