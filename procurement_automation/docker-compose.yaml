# Docker Compose for Local Development
# 
# This configuration works alongside the Kubernetes deployment without conflicts.
# Service names match K8s service names with -service suffix for consistency.
# 
# Access:
#   - Frontend UI: http://localhost:3000
#   - Backend API: http://localhost:3000/api/ (proxied through Nginx)
#   - Backend Direct: http://localhost:8000 (for debugging)
#   - ModelAdmin Direct: http://localhost:8100
#   - Azurite Blob: http://localhost:10000
#
# Run: docker-compose up -d
# Stop: docker-compose down
# Logs: docker-compose logs -f [service-name]

services:
  # Azurite: Azure Storage Emulator for local development
  azurite-service:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite-container
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"  # Blob storage
      - "10001:10001"  # Queue storage
      - "10002:10002"  # Table storage
    networks:
      - local-dev

  # Frontend: React + Vite application served with Nginx
  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-container
    ports:
      - "3000:80"
    networks:
      - local-dev
    depends_on:
      - azurite-service
      - backend-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend: FastAPI application (named backend-service to match nginx.conf proxy target)
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-container
    ports:
      - "8000:8000"
    env_file:
      - ./.env.local
    environment:
      - MODE=api
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite:////app/data/invoice_ocr.db
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:-documents}
      - AZURE_STORAGE_QUEUE_NAME=${AZURE_STORAGE_QUEUE_NAME:-document-processing}
      - MODELADMIN_EXTERNAL_ENDPOINT=${MODELADMIN_EXTERNAL_ENDPOINT:-http://modeladmin-service:8100}
      - MODELADMIN_EXTERNAL_API_KEY=${MODELADMIN_EXTERNAL_API_KEY:-modeladmin-local-key}
    volumes:
      # Shared SQLite volume used by both API and worker so they observe the same job state.
      - finopt-backend-data:/app/data
    networks:
      - local-dev
    depends_on:
      - azurite-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ModelAdmin: Standalone FastAPI runtime for candidate/review boundaries
  modeladmin-service:
    build:
      context: ./modeladmin_service
      dockerfile: Dockerfile
    container_name: modeladmin-container
    ports:
      - "8100:8100"
    env_file:
      - ./.env.local
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - MODELADMIN_DATABASE_URL=sqlite:////app/data/modeladmin_service.db
      - MODELADMIN_SERVICE_PORT=8100
      - BOUNDARY_API_KEY=${BOUNDARY_API_KEY:-modeladmin-local-key}
    volumes:
      - finopt-modeladmin-data:/app/data
    networks:
      - local-dev
    depends_on:
      - azurite-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  # Worker: Queue-driven document processing runtime
  worker-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worker-container
    env_file:
      - ./.env.local
    environment:
      MODE: worker
      DATABASE_URL: sqlite:////app/data/invoice_ocr.db
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-documents}
      AZURE_STORAGE_QUEUE_NAME: ${AZURE_STORAGE_QUEUE_NAME:-document-processing}
      MODELADMIN_EXTERNAL_ENDPOINT: ${MODELADMIN_EXTERNAL_ENDPOINT:-http://modeladmin-service:8100}
      MODELADMIN_EXTERNAL_API_KEY: ${MODELADMIN_EXTERNAL_API_KEY:-modeladmin-local-key}
    volumes:
      # Mount the same backend DB volume as API to keep job status and metadata consistent.
      - finopt-backend-data:/app/data
    networks:
      - local-dev
    depends_on:
      - backend-service
      - azurite-service


networks:
  local-dev:
    driver: bridge

volumes:
  finopt-backend-data:
    name: finopt-backend-data
  finopt-modeladmin-data:
    name: finopt-modeladmin-data