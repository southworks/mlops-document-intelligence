server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS resolver so nginx re-resolves backend-service after restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to backend service
    location /api/ {
        set $backend backend-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for long-running OCR operations
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        
        # Allow large file uploads
        client_max_body_size 50M;
    }

    # Serve React app from root for local dev
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        location ~ ^/index\.html$ {
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ ^/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
